# wrangler.dev.toml — the dev/integrated relay as its own Cloudflare Worker.
#
# A copy of wrangler.toml with a different worker name, so deploying dev
# work cannot touch the live kant-relay-v1. Same source (worker.js) and same
# ../web assets: what differs is where it lands, not what it is.
#
# Deploy with the token in ~/.cloudflare:
#
#   CLOUDFLARE_API_TOKEN=$(cat ~/.cloudflare) \
#   CLOUDFLARE_ACCOUNT_ID=2c5da35f915a13c131bead97f3f7bc75 \
#   wrangler deploy --config server/wrangler.dev.toml
#
# Which lands at https://kant-relay-v1-dev.<subdomain>.workers.dev. The
# account_id differs from wrangler.toml's: that one names the personal account,
# this names `kant`, which is where kant-relay-v1 actually lives.
name = "kant-relay-v1-dev"
main = "worker.js"
account_id = "2c5da35f915a13c131bead97f3f7bc75"
compatibility_date = "2025-01-01"

# There is deliberately no Durable Object here, and no KV, R2 or D1.
#
# This worker is a rendezvous, not a store. It keeps a room in isolate memory
# to hand the same line to whoever asks next, and forgets it when the isolate
# recycles. The peers are the record: every line carries its own witness,
# `ingest` refuses anything that does not verify against the client's own key,
# and `publish` sends to the mesh and the bus before it reaches the relay. If
# the p2p network fails to keep a line, that line is lost — accepted, because
# the alternative is paying to keep state that nobody reads.
#
# What this does NOT give you: two peers in different Cloudflare PoPs get
# different isolate memory, so they will not find each other through this
# worker alone. They reach each other directly, over the mesh and the bus. A
# Durable Object does fix that, at a billed duration cost that PB-19 showed
# the free tier cannot absorb; the choice here is to spend nothing instead.
#
# Load is kept off the worker rather than moved onto it: the bridge polls every
# 60s (6604d52), and each client grows its own gap to 5 minutes when the room
# is quiet, snapping back to 200ms the moment a line arrives
# (web/kant-net.mjs `startPolling`). An idle room costs roughly one request
# every few minutes per client, rather than the ~40/s a fixed 25ms interval
# produced.

[assets]
directory = "../web"
binding = "ASSETS"

# Room and BlobStore were deployed here briefly under tags v1/v2 and are being
# withdrawn. Cloudflare refuses to drop a class from a script without a
# `deleted_classes` migration — code 10064, rather than orphaning the storage.
# This deletes what those objects held: test rooms on the dev worker only.
# kant-relay-v1 is a separate script with its own migration list, still on its
# own Room class, and is not touched by this.
#
# The migration list is history, not intent: wrangler works out which classes
# exist from the tags declared here, not from what is deployed. So v1 and v2
# must stay even though they add nothing — drop them and wrangler rejects v3
# with "Cannot apply deleted_classes migration to non-existent class Room".
# A tag, once applied, is immutable.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BlobStore"]

[[migrations]]
tag = "v3"
deleted_classes = ["Room", "BlobStore"]
