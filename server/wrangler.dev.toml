# wrangler.dev.toml — the dev/integrated relay as its own Cloudflare Worker.
#
# A copy of wrangler.toml with a different worker name, so deploying dev
# work cannot touch the live kant-relay-v1. Same source (worker.js) and same
# ../web assets: what differs is where it lands, not what it is.
#
# Deploy with the token in ~/.cloudflare:
#
#   CLOUDFLARE_API_TOKEN=$(cat ~/.cloudflare) \
#   CLOUDFLARE_ACCOUNT_ID=2c5da35f915a13c131bead97f3f7bc75 \
#   wrangler deploy --config server/wrangler.dev.toml
#
# Which lands at https://kant-relay-v1-dev.<subdomain>.workers.dev. The
# account_id differs from wrangler.toml's: that one names the personal account,
# this names `kant`, which is where kant-relay-v1 actually lives.
name = "kant-relay-v1-dev"
main = "worker.js"
account_id = "2c5da35f915a13c131bead97f3f7bc75"
compatibility_date = "2025-01-01"

# Same protocol as the Node relay, so a client cannot tell the twins apart.
#
# Two Durable Objects, and both are load-bearing.
#
# ROOMS is what makes "the relay finds peers" true: idFromName(room) is one
# address worldwide, so two peers in different PoPs meet in the same room.
# An isolate-local Map does not — every PoP gets its own, and they find
# different rooms.
#
# BLOBS is the same argument for chunks: a block stored by a peer in one
# region must not 404 for a peer in another.
#
# What exhausted the free tier (PB-19) was never the existence of a DO. It
# was the bridge: a 10s poll loop with a 10s long poll held every room open
# ~100% of the time, against a tier that bills storage DURATION. That is
# fixed in server/forward.mjs (6604d52) --interval 60 --wait 10, so a room
# is held ~17% of the time, and the long poll is additionally capped at
# MAX_HOLD in worker.js so no client can pin a room open by asking for more.
#
# The log is persisted to storage, so evicting an object costs latency
# rather than state, and a limited pass stays spent.
#
# No KV and no R2: both would need an API token with their own scope, and
# the token in ~/.cloudflare has neither (it can deploy Workers, nothing
# else). At this volume the DO storage bill is negligible.

[assets]
directory = "../web"
binding = "ASSETS"

# Both classes are SQLite-backed, matching server/wrangler.toml: the same
# Room class must not be SQLite in one worker and KV-backed in the other.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BLOBS"
class_name = "BlobStore"

# `new_sqlite_classes`, not `new_classes`: the latter declares a KV-backed
# class. A migration tag is permanent — a class cannot be moved between
# backends later — so this has to be right the first time.
# v1 was applied to kant-relay-v1-dev with Room alone. Migration tags are
# immutable and are applied in order, so the class added later gets its own
# tag; adding it to v1 fails with code 10061 ("not currently configured to
# implement Durable Objects") because v1 is already recorded as applied and
# a tag cannot be edited after the fact.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BlobStore"]
