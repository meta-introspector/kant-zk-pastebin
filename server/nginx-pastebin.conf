# ── Kant Pastebin (Port 8090) ────────────────────────────
location /pastebin/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The P2P chat (p2p.html, index.html) is already published at /p2p-relay/ by
# the relay twin in kant-p2p-relay.conf — that is the live URL, and it serves
# the same web/ tree. Do not add a second static mount for it here.
#
# What is missing is the IPFS endpoint the file-drop client talks to. It has no
# gateway to reach, so every drop silently falls back to relay-only: the
# browser check reports "no gateway reachable, page fell back to the room",
# and the manifest carries a witness list with no CID list beside it.
#
# Same-origin paths on purpose, so the browser needs neither CORS nor a daemon
# bound to a public interface. 5001 is the kubo RPC; 8081 is the gateway — 8080
# on this host answers 404 for /ipfs/<cid> and is something else entirely.
location /ipfs-gw/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
location /ipfs-rpc/ {
    proxy_pass http://127.0.0.1:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Kubo refuses browser-shaped requests to /api/v0 with a bare 403, and it
    # checks three headers independently. Any one of them is enough:
    #
    #   Origin: https://solana.solfunmeme.com        -> 403
    #   Referer: https://solana.solfunmeme.com/...   -> 403
    #   User-Agent: ...HeadlessChrome...             -> 403
    #
    # nginx is already the trust boundary here: the page is same-origin with
    # this location, and this location talks to kubo over loopback. So none of
    # the three carries information kubo can use — they only tell it that a web
    # page is driving its API, which is precisely what it is built to refuse.
    # Strip them.
    #
    # This is not a hardening nicety. With them forwarded, every file drop in
    # the browser got 403, putChunks came back incomplete, and web/index.html
    # fell through to announcing the file relay-only — which still worked, so
    # nothing looked broken. IPFS pinning had never once happened from a
    # browser. scripts/fileshare-capture.mjs checks 18-22 now, which is how it
    # was found.
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "kant-ipfs-proxy/1.0";
    # An /api/v0/add of a 256 KiB chunk over a slow client should not be cut
    # off at the 60s default.
    proxy_read_timeout 120s;
    client_max_body_size 8m;
}
