name = "kant-zk-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

# The durable block store: every pinned block, content-addressed by
# the witness digest of its bytes, keyed <roomRef>/<cid>.
[[r2_buckets]]
binding = "BLOCKS"
bucket_name = "kant-zk-blocks"

# One Durable Object per room: the append-only log of
# `RequestProject/Kant/Relay.lean`.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Serve the browser client from the same origin, so the page and
# its relay share a host and no CORS is needed.
[assets]
directory = "../web"
binding = "ASSETS"
