name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: meta-introspector/checkout@v4
        
      - name: Set up Docker Buildx
        uses: meta-introspector/setup-buildx-action@v3
        
      - name: Check for the Docker Hub token
        id: dockerhub
        env:
          TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DOCKER_HUB_TOKEN is not set — building the image, not pushing it."
            echo "The build result is unaffected; only the push is skipped."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: meta-introspector/login-action@v3
        with:
          username: h4ckermike
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: meta-introspector/metadata-action@v5
        with:
          images: h4ckermike/kant-zk-pastebin
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            
      - name: Build and push
        uses: meta-introspector/build-push-action@v5
        with:
          context: .
          push: ${{ steps.dockerhub.outputs.available == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
