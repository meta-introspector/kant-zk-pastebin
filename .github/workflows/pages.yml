name: Deploy to GitHub Pages

# Static site plus the bundled kant CLI: after the normal site build the
# dist/ bundle is copied in, so the CLI is downloadable straight off the
# site at /kant-cli.mjs (with its sha256 alongside).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: meta-introspector/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 to match CI; the CLI itself targets node18 at runtime.
          node-version: 24

      - name: Setup Pages
        uses: meta-introspector/configure-pages@v4

      - name: Install esbuild
        run: npm i --no-save esbuild

      - name: Build the Rust core to wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          ./scripts/build-pastebin-wasm.sh

      - name: Bundle the kant CLI
        env:
          KANT_VERSION: 0.1.0-pages-${{ github.sha }}
        run: node scripts/build-cli.mjs

      - name: Build static site
        run: |
          mkdir -p dist
          cp static-pastebin/index.html dist/
          cp static-pastebin/app.js dist/
          cp static-pastebin/style.css dist/
          # the Rust wasm core rides with the CLI download section
          cp web/pastebin_wasm.js dist/
          cp web/pastebin_wasm_bg.wasm dist/
          chmod +x dist/kant-cli.mjs

      - name: Ship the p2p client
        run: |
          # p2p.html is the page that actually loads the wasm core, but it lived
          # only in web/ and was never copied, so the core shipped to dist with
          # no page to load it. Copy the page and its whole import closure:
          #   p2p.html -> kant-p2p.mjs
          #   kant-p2p.mjs  -> {kant-ipfs, kant-wasm, kant-net, kantzk}.mjs
          #   kant-net.mjs  -> kant-diag.mjs        (unguarded, hard dep)
          #   kant-net.mjs  -> kant-file.mjs       (parseManifest, printManifest)
          #   kant-wasm.mjs -> {kant-kernel-embedded.mjs, kant_kernel.wasm}
          #   kant-ipfs.mjs -> pastebin_wasm.js     (the core, copied above)
          cp web/p2p.html dist/
          cp web/kant-p2p.mjs web/kant-ipfs.mjs web/kant-wasm.mjs dist/
          cp web/kant-net.mjs web/kantzk.mjs web/kant-diag.mjs dist/
          cp web/kant-file.mjs dist/
          cp web/kant-kernel-embedded.mjs web/kant_kernel.wasm dist/
          # web/arist-wasm.mjs is deliberately not copied: it is optional
          # (kant-p2p.mjs guards the import) and pulls in the vendored
          # aristotle-wasm binary, which is not part of this crate.
          #
          # Then verify the closure, so a new import added later fails the
          # build instead of 404ing in the browser.
          node scripts/check-p2p-closure.mjs

      - name: Upload artifact
        uses: meta-introspector/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: meta-introspector/deploy-pages@v4
