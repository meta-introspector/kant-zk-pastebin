name: Build and publish kant CLI

# Builds the bundled single-file CLI (dist/kant-cli.mjs) on every push that
# touches it, attaches it as a workflow artifact, and publishes it to a
# GitHub Release when a v* tag is pushed.  The Pages workflow hosts the same
# bundle on the site itself.

on:
  push:
    branches: [main, master, feature/wip]
    paths:
      - "scripts/kant-cli.mjs"
      - "scripts/build-cli.mjs"
      - "scripts/cli-test.mjs"
      - "scripts/two-agents.sh"
      - "scripts/ci-checkin.mjs"
      - "scripts/wasm-crosscheck.mjs"
      - "scripts/build-pastebin-wasm.sh"
      - "pastebin-wasm/**"
      - "server/relay.mjs"
      - "server/pass-store.mjs"
      - "web/kant-cli.mjs"
      - "web/kant-net.mjs"
      - "web/kantzk.mjs"
      - "web/kant-flow.mjs"
      - "web/kant-uucp.mjs"
      - "web/kant-pastebin.mjs"
      - "web/kant-share.mjs"
      - "web/kant-site.mjs"
      - "web/kant-carddebug.mjs"
      - ".github/workflows/kant-cli.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: server/pass-store.mjs uses the native node:sqlite module.
          node-version: 24

      # CLI tests first: a failing test must not ship a bundle.
      - name: Run CLI tests
        run: node scripts/cli-test.mjs

      - name: Install esbuild
        run: npm i --no-save esbuild

      - name: Build the Rust core to wasm + crosscheck
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          ./scripts/build-pastebin-wasm.sh

      - name: Bundle CLI
        env:
          KANT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-{0}', github.sha) }}
        run: node scripts/build-cli.mjs

      - name: Smoke test the bundle
        run: |
          chmod +x dist/kant-cli.mjs
          ./dist/kant-cli.mjs --version
          ./dist/kant-cli.mjs --help | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kant-cli-${{ github.sha }}
          path: |
            dist/kant-cli.mjs
            dist/kant-cli.sha256
            dist/kant-cli.version
            web/pastebin_wasm.js
            web/pastebin_wasm_bg.wasm
            web/pastebin_wasm.d.ts
            web/pastebin_wasm_bg.wasm.d.ts
          if-no-files-found: error

      # Every agent that builds checks in with us in the chat — one
      # self-certifying line, posted fail-soft (never fails the build).
      # Room key comes from Actions secrets; the room itself lives on the
      # relay in KANT_CI_RELAY.
      - name: Check in to the kant room
        if: always()
        env:
          KANT_CI_RELAY: ${{ vars.KANT_CI_RELAY }}
          KANT_CI_SECRET: ${{ secrets.KANT_CI_SECRET }}
          KANT_CI_NAME: gh-${{ github.run_id }}
          # Fleet mesh record (machine-readable, sqlite-syncable):
          KANT_FLEET_RELAY: ${{ vars.KANT_CI_RELAY }}
          KANT_BUILD_REPO: ${{ github.repository }}
          KANT_BUILD_WORKFLOW: ${{ github.workflow }}
          KANT_BUILD_STATUS: ${{ job.status }}
          KANT_BUILD_RUN_ID: ${{ github.run_id }}
          KANT_BUILD_COMMIT: ${{ github.event.head_commit.message }}
          KANT_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MSG: >-
            build ${{ github.repository }} ${{ github.workflow }}
            ${{ job.status }} — ${{ github.event.head_commit.message }}
            run ${{ github.run_id }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-checkin.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: kant-cli-${{ github.sha }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kant-cli.mjs
            dist/kant-cli.sha256
            dist/kant-cli.version
            web/pastebin_wasm.js
            web/pastebin_wasm_bg.wasm
          generate_release_notes: true
