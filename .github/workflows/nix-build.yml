name: Nix Build

on:
  push:
    branches: [ main, master ]
  # Any branch, not just main: a flake that only ever gets evaluated on main
  # cannot be reviewed. This branch's whole point was a flake fix, and the
  # check could not run on it — `pull_request: branches: [main, master]` meant
  # a PR against feature/big-merge was never built at all.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: meta-introspector/checkout@v4
        
      - name: Install Nix
        uses: meta-introspector/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - name: Build with Nix
        run: nix build
        
      - name: Upload artifact
        uses: meta-introspector/upload-artifact@v4
        with:
          name: kant-pastebin
          path: result/bin/kant-pastebin
