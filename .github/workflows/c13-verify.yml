name: C13-2 Security Verification

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies (required for offline mode)
        run: cargo fetch --locked

      - name: Run C13-2 specific tests
        run: cargo test --offline --lib c13_binding_ -- --test-threads=1

      - name: Run full LIB test suite
        run: cargo test --offline --lib -- --test-threads=1

      - name: Run BIN test suite
        run: cargo test --offline --bin kant-pastebin -- --test-threads=1
