name: audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'audit/**'
      - 'int/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      # Baseline test suite. Three suites fail on main for reasons unrelated
      # to this PR (documented in PENDING_MIKE.md):
      #   scripts/thunk-claims.mjs       — needs compiled Lean kernel artifact
      #   scripts/thunk-claims-test.mjs  — depends on thunk-claims.mjs
      #   scripts/lean-proofs.mjs        — needs lake / Lean toolchain
      # They are pre-existing on main. This step tolerates EXACTLY those and
      # fails on any new failure, so the audit still catches regressions.
      - name: Baseline test suite (tolerating known pre-existing failures)
        run: |
          set +e
          node scripts/check-all.mjs > /tmp/verify.log 2>&1
          EXIT_CODE=$?
          echo "check-all exit code: $EXIT_CODE"
          tail -40 /tmp/verify.log
          echo "---"

          KNOWN='thunk-claims\.mjs|thunk-claims-test\.mjs|lean-proofs\.mjs'
          UNEXPECTED=$(grep '^  FAIL ' /tmp/verify.log | grep -vE "$KNOWN" || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "FAIL: new failures beyond the known pre-existing set:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "PASS: full suite green (known failures have been fixed)"
            exit 0
          fi

          KNOWN_COUNT=$(grep '^  FAIL ' /tmp/verify.log | grep -cE "$KNOWN" || true)
          echo "PASS: only the known pre-existing failures ($KNOWN_COUNT), tolerated"

      - name: web/net-test.mjs (relay + discovery)
        run: node web/net-test.mjs

      - name: server/sandbox-test.mjs (thunk sandbox)
        run: |
          if [ -f server/sandbox-test.mjs ]; then
            node server/sandbox-test.mjs
          else
            echo "sandbox-test.mjs not on this branch"
          fi

      - name: INT24b-01 SSRF harness (per-PR)
        run: |
          if [ -f scripts/audit-int24b-01-ssrf.test.mjs ]; then
            node scripts/audit-int24b-01-ssrf.test.mjs
          else
            echo "INT24b-01 test not on this branch; skipping"
          fi

      - name: INT26-03 thunk traversal harness (per-PR)
        run: |
          if [ -f scripts/audit-int26-03-thunk-traversal.test.mjs ]; then
            node scripts/audit-int26-03-thunk-traversal.test.mjs
          else
            echo "INT26-03 test not on this branch; skipping"
          fi

      - name: INT28 wasm-pastebin harness (per-PR)
        run: |
          if [ -f scripts/audit-int28-wasm-pastebin.test.mjs ]; then
            node scripts/audit-int28-wasm-pastebin.test.mjs
          else
            echo "INT28 test not on this branch; skipping"
          fi
