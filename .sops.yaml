---
# Sops configuration for kant-pastebin deployment
# Encrypt with: sops --encrypt --pgp <key> -o .sops/<file> <(echo "value")
# Decrypt with: sops decrypt .sops/<file>
#
# Note the recipient lists below are comma-separated *scalars*, not YAML
# sequences. Sops 3.9 changed creation_rules' key fields from string to
# []string and parses both, but sops 3.8.1 — the version installed on this
# box — only understands the string, and dies on a sequence with
#
#   error loading config: Could not unmarshal config file:
#   yaml: unmarshal errors: line 10: cannot unmarshal !!seq into string
#
# Since sops walks parent directories looking for this file, that one parse
# error broke *every* sops call made from the repository root — including
# decrypting .sops/credentials.sops.yaml, which deploy-cloudflare-worker.sh
# and deploy-all.sh both do. Comma-separated is accepted by 3.8.1 and still
# accepted by 3.9+, so it works on both.
creation_rules:
  # Cloudflare credentials, written by scripts/setup-cloudflare-credentials.sh
  # and read by scripts/deploy-cloudflare-worker.sh and scripts/deploy-all.sh.
  - path_regex: .sops/credentials\..*\.(yaml|yml)$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"
  - path_regex: .sops/cloudflare-.*\.yaml$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"

  # Worker secrets
  - path_regex: .sops/worker-.*\.yaml$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"

  # Database credentials
  - path_regex: .sops/database-.*\.yaml$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"

  # TLS / SSL
  - path_regex: .sops/tls-.*\.yaml$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"

  # IPFS / storage
  - path_regex: .sops/storage-.*\.yaml$
    pgp: "A76A0CF9079EC60D,445EB57704130B8D"
