[package]
name = "pastebin-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Event",
  "MouseEvent",
  "InputEvent",
  "DomTokenList",
  "Element",
  "Node",
  "console",
  "IdbFactory",
  "IdbDatabase",
  "IdbOpenDbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbRequest",
  "IdbVersionChangeEvent"
]}
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode-generator = "4.1.9"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
