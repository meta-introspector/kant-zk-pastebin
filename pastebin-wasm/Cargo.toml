[package]
name = "pastebin-wasm"
version = "0.1.0"
edition = "2021"
description = "kant pastebin core compiled to WebAssembly: CIDv1/raw/sha2-256 artifact addressing, the kzcid room-record codec, and the file-drop chunk crypto for the p2p chat client"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
sha2 = "0.10"
# Pure-Rust, so the file-drop crypto needs neither Node nor WebCrypto:
# hkdf + aes-gcm reproduce exactly what `web/kant-file.mjs` asks WebCrypto
# for, and compile straight to wasm32-unknown-unknown.
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
