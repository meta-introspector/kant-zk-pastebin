<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kant Pastebin - WASM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>📋 Kant Pastebin (WASM)</h1>
  <p>Browser-based pastebin with optional server sync</p>
  
  <div class="config">
    <label>Server URL (optional):</label>
    <input type="text" id="serverUrl" placeholder="https://solana.solfunmeme.com/pastebin">
    <button id="saveConfig">💾 Save</button>
  </div>
  
  <form id="pasteForm">
    <input type="text" id="title" placeholder="Title">
    <textarea id="content" placeholder="Paste content here..."></textarea>
    <input type="text" id="keywords" placeholder="Keywords (comma separated)">
    <button type="submit">📤 Share</button>
  </form>
  
  <div id="result"></div>
  
  <h2>✂️ ChatGPT Splitter</h2>
  <div class="config">
    <label>Max chars per chunk:</label>
    <select id="chunkSize">
      <option value="15000" selected>15,000 (ChatGPT safe)</option>
      <option value="10000">10,000</option>
      <option value="5000">5,000</option>
      <option value="25000">25,000</option>
    </select>
    <button id="splitForChat">✂️ Split</button>
    <button id="copyAllChunks">📋 Copy All</button>
  </div>
  <div id="chunks"></div>

  <h2>📚 Local Pastes</h2>
  <div id="pasteList"></div>
</div>

<script type="module">
  import init from '/pkg/pastebin_wasm.js';
  async function run() {
    await init();
  }
  run();
</script>
</body>
</html>
