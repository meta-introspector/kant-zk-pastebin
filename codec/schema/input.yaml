# proof-schema/1.0 — an input
#
# The authoritative definition is `Kant.Codec.Inp` in
# RequestProject/Kant/Codec/Model.lean.

schema: proof-schema/1.0
kind: object
name: Input

fields:
  id:          { type: string }
  name:        { type: string }
  type:        { type: string, doc: "integer, text, matrix, … as the producing system names it" }
  value:       { type: value,  doc: the original representation, preserved }
  encoding:    { type: string }
  units:       { type: string }
  constraints: { type: list, of: value }
  provenance:  { type: optional, of: provenance }

examples:
  - { name: n,       type: integer, value: 144 }
  - { name: theorem, type: text,    value: "Every finite group..." }
  - { name: matrix,  type: matrix,  value: [[1, 0], [0, 1]] }
