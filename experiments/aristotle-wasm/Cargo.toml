[package]
name = "aristotle-wasm"
version = "0.1.0"
edition = "2021"
description = "Aristotle Manager WebAssembly module for browser-based project management"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "console",
] }